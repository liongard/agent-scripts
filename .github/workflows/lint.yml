name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

# Report-only for now: the scripts have not been linted yet. Remove
# continue-on-error once the existing findings are triaged.
jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./windows -Recurse
          $results | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
          if ($results) { exit 1 }

  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck linux/*.sh

  # Blocking: the masking tests must pass.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run masking tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

  # Blocking: the shared blocks must be identical in every Windows script that has them.
  shared-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shared blocks
        shell: pwsh
        run: ./tests/Test-SharedBlocks.ps1

  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI binary, not gitleaks/gitleaks-action (that action needs a license key for org repos).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Scan only the commits being checked, so a finding on another branch can't fail this run:
          # a PR's own commits, main's history on a push to main, or a pushed branch's commits not on main.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            range="$GITHUB_SHA"
          else
            range="origin/${DEFAULT_BRANCH}..${GITHUB_SHA}"
          fi
          echo "gitleaks range: ${range}"
          ./gitleaks git --redact --verbose --log-opts="${range}" .
